name: haqvox
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  audio_video_progress_bar: ^2.0.3
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  device_info_plus: any
  dio: ^5.11.1
  drift: ^2.14.0
  file_picker: ^10.1.9
  filesize: ^2.0.1
  flip_card: ^0.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_cache_manager: ^3.4.1
  flutter_dotenv: ^5.2.1
  flutter_gen: ^5.9.0
  flutter_launcher_icons: ^0.13.1
  flutter_slidable: ^3.0.0
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.1.0
  flutter_time_picker_spinner: ^2.0.0
  fluttertoast: ^8.2.1
  font_awesome_flutter: ^11.0.0
  get_it: ^8.0.3
  go_router: ^15.1.1
  google_fonts: ^6.2.1
  google_mobile_ads: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  http: ^1.4.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.17
  logging: ^1.3.0
  page_transition: ^2.0.9
  palette_generator: ^0.3.3+7
  path: ^1.8.0
  path_provider: ^2.1.5
  percent_indicator: ^4.2.3
  permission_handler: ^12.0.0+1
  razorpay_flutter: ^1.4.5
  rxdart: ^0.28.0
  share_plus: ^11.0.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  sliding_up_panel: ^2.0.0+1
  smooth_page_indicator: ^1.1.0
  sqlite3: ^2.1.0
  sqlite3_flutter_libs: ^0.5.0
  webview_flutter: ^4.14.1

dev_dependencies:
  build_runner: ^2.4.6
  drift_dev: ^2.14.0
  flutter_test:
    sdk: flutter

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/haqvox-logo.jpg"
  # adaptive_icon_background: "#009688"
  # adaptive_icon_foreground: "assets/haqvox-logo.jpg"
  min_sdk_android: 21

  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/
    - assets/icons/
    - assets/users/
    - assets/banner/
    - assets/books/
    - assets/paymentMethod/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
